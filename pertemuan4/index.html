<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Transformasi Fourier Citra</title>
    <style>
      .channel-container {
        display: flex;
        gap: 10px;
        margin-top: 10px;
        flex-wrap: wrap;
      }
      .channel-block {
        text-align: center;
      }
      canvas {
        border: 1px solid #000;
        margin-top: 5px;
      }
      #resolution {
        margin-top: 10px;
      }
      button {
        margin-top: 5px;
        margin-right: 5px;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <h3>Transformasi Fourier Citra</h3>
    <canvas id="gambar" width="300" height="300"></canvas><br />
    <input type="file" id="file1" accept=".jpg,.jpeg,.png,.bmp" /><br />
    <div id="resolution"></div>
    <button id="fourierBtn" onclick="transformFourier('gambar')">
      Fourier Transform
    </button>
    <button id="inverseBtn" onclick="inverseFourier()">
      Inverse Fourier Transform
    </button>
    <div id="channels" class="channel-container"></div>
    <script>
      let originalImage = null;
      let dft2DReal = null;
      let dft2DImag = null;
      let width = 0, height = 0;
      let inverseClicked = false; // Flag untuk mengkonfirmasi apakah sudah pernah diinverse
      function loadImage(fileInput, canvasId) {
      const file = fileInput.files[0];
      if (!file) return;
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext("2d");
      const img = new Image();
      img.onload = function () {
      canvas.width = img.width;
      canvas.height = img.height;
      width = img.width;
      height = img.height;
      ctx.drawImage(img, 0, 0);
      originalImage = img;
      dft2DReal = null;
      dft2DImag = null;
      inverseClicked = false; // reset flag
      document.getElementById("inverseBtn").disabled = false; // aktifkan
      // kembali tombol inverse
      document.getElementById("resolution").textContent = `Resolution:
      ${img.width} x ${img.height}`;
      clearChannels();
      };
      img.src = URL.createObjectURL(file);
      }

      function clearChannels() {
      document.getElementById("channels").innerHTML = "";
      }
      function createChannelCanvas(label, width, height, imgData) {
      const container = document.getElementById("channels");
      const block = document.createElement("div");
      block.className = "channel-block";
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.putImageData(imgData, 0, 0);
      const caption = document.createElement("p");
      caption.textContent = label;
      block.appendChild(canvas);
      block.appendChild(caption);
      container.appendChild(block);
      }
      // ==============================
      // DFT & IDFT 1D
      // ==============================
      function DFT1D(inputReal, inputImag = null) {
      const N = inputReal.length;
      const real = new Array(N).fill(0);
      const imag = new Array(N).fill(0);
      for (let k = 0; k < N; k++) {
      for (let n = 0; n < N; n++) {
      const angle = (-2 * Math.PI * k * n) / N;
      const valR = inputReal[n];
      const valI = inputImag ? inputImag[n] : 0;
      real[k] += valR * Math.cos(angle) - valI * Math.sin(angle);
      imag[k] += valR * Math.sin(angle) + valI * Math.cos(angle);
      }
      }
      return { real, imag };
      }
      function IDFT1D(inputReal, inputImag) {
      const N = inputReal.length;
      const outR = new Array(N).fill(0);
      const outI = new Array(N).fill(0);
      for (let n = 0; n < N; n++) {
      let sumR = 0;
      let sumI = 0;
      for (let k = 0; k < N; k++) {
      const angle = (2 * Math.PI * k * n) / N;
      sumR += inputReal[k] * Math.cos(angle) - inputImag[k] *
      Math.sin(angle);
      sumI += inputReal[k] * Math.sin(angle) + inputImag[k] *
      Math.cos(angle);
      }
      outR[n] = sumR / N;
      outI[n] = sumI / N;
      }
      return { real: outR, imag: outI };
      }
      // FOURIER TRANSFORM 2D
      function transformFourier(canvasId) {
      clearChannels();
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext("2d");
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      width = canvas.width;
      height = canvas.height;
      // Grayscale + Centering sebelum DFT
      let gray = [];
      for (let y = 0; y < height; y++) {
      gray[y] = [];
      for (let x = 0; x < width; x++) {
      const i = (y * width + x) * 4;
      let g = Math.round(0.299 * imgData.data[i] + 0.587 * imgData.data[i
      + 1] + 0.114 * imgData.data[i + 2]);
      g = g * ((x + y) % 2 === 0 ? 1 : -1);
      gray[y][x] = g;
      }
      }
      // DFT baris
      let tempReal = [];
      let tempImag = [];
      for (let y = 0; y < height; y++) {
      const { real, imag } = DFT1D(gray[y]);
      tempReal[y] = real;
      tempImag[y] = imag;
      }
      // DFT kolom
      dft2DReal = [];
      dft2DImag = [];
      for (let x = 0; x < width; x++) {
      const colR = [], colI = [];
      for (let y = 0; y < height; y++) {
      colR.push(tempReal[y][x]);
      colI.push(tempImag[y][x]);
      }
      const { real, imag } = DFT1D(colR, colI);
      for (let y = 0; y < height; y++) {
      if (!dft2DReal[y]) dft2DReal[y] = [], dft2DImag[y] = [];
      dft2DReal[y][x] = real[y];
      dft2DImag[y][x] = imag[y];
      }
      }
      // Magnitude log scale (DC di tengah)
      const newImgData = ctx.createImageData(width, height);
      let maxMag = 0;
      const mag = [];
      for (let y = 0; y < height; y++) {
      mag[y] = [];
      for (let x = 0; x < width; x++) {
      const val = Math.sqrt(dft2DReal[y][x] ** 2 + dft2DImag[y][x] ** 2);
      mag[y][x] = Math.log(1 + val);
      if (mag[y][x] > maxMag) maxMag = mag[y][x];
      }
      }
      for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
      const i = (y * width + x) * 4;
      const val = Math.round((mag[y][x] / maxMag) * 255);
      newImgData.data[i] = newImgData.data[i + 1] = newImgData.data[i + 2]
      = val;
      newImgData.data[i + 3] = 255;
      }
      }
      createChannelCanvas("Fourier Transform (Magnitude - Centered)", width,
      height, newImgData);
      }
      // INVERSE FOURIER TRANSFORM 2D
      function inverseFourier() {
      if (inverseClicked) return; // Disable klik inverse jika sudah pernah
      // diklik
      if (!dft2DReal || !dft2DImag) {
      alert("Silakan lakukan Fourier Transform terlebih dahulu!");
      return;
      }
      // IDFT kolom
      let tempReal = [];
      let tempImag = [];
      for (let x = 0; x < width; x++) {
      const colR = [], colI = [];
      for (let y = 0; y < height; y++) {
      colR.push(dft2DReal[y][x]);
      colI.push(dft2DImag[y][x]);
      }
      const { real, imag } = IDFT1D(colR, colI);
      for (let y = 0; y < height; y++) {
      if (!tempReal[y]) tempReal[y] = [], tempImag[y] = [];
      tempReal[y][x] = real[y];
      tempImag[y][x] = imag[y];
      }
      }
      // IDFT baris + balik centering
      const newImgData =
      document.getElementById("gambar").getContext("2d").createImageData(width,
      height);
      for (let y = 0; y < height; y++) {
      const { real } = IDFT1D(tempReal[y], tempImag[y]);
      for (let x = 0; x < width; x++) {
      let val = real[x] * ((x + y) % 2 === 0 ? 1 : -1);
      val = Math.min(Math.max(Math.round(val), 0), 255);
      const i = (y * width + x) * 4;
      newImgData.data[i] = newImgData.data[i + 1] = newImgData.data[i + 2]
      = val;
      newImgData.data[i + 3] = 255;
      }
      }
      createChannelCanvas("Inverse Fourier Transform", width, height,
      newImgData);
      // Tandai tombol sudah diklik
      inverseClicked = true;
      document.getElementById("inverseBtn").disabled = true;
      }
      document.getElementById("file1").addEventListener("change", function () {
      loadImage(this, "gambar");
      });
    </script>
  </body>
</html>
