<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Canvas Rotate & Flip</title>
</head>
<body>
  <h3>Gambar 1</h3>
  <canvas id="gambar" width="300" height="300" style="border:1px solid
#000"></canvas><br>
  <input type="file" id="file1" accept=".jpg,.jpeg,.png,.bmp"><br>
  <button onclick="rotate('gambar', 90)">Rotate 90°</button>
  <button onclick="rotate('gambar', 180)">Rotate 180°</button>
  <button onclick="rotate('gambar', 270)">Rotate 270°</button>
  <button onclick="flipHorizontal('gambar')">Flip Horizontal</button>
  <button onclick="flipVertical('gambar')">Flip Vertical</button>
  <button onclick="saveImage('gambar')">Save</button>
  <script>
    // Load image ke canvas
    function loadImage(fileInput, canvasId) {
      const file = fileInput.files[0];
      if (!file) return;
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext("2d");
      const img = new Image();
      img.onload = function () {
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);
      };
      img.src = URL.createObjectURL(file);
    }

    function transformCanvas(canvasId, transform) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext("2d");
      const source = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const sourceWidth = canvas.width;
      const sourceHeight = canvas.height;
      const { width, height, data } = transform(sourceWidth, sourceHeight, source.data);
      const output = ctx.createImageData(width, height);
      output.data.set(data);
      canvas.width = width;
      canvas.height = height;
      ctx.putImageData(output, 0, 0);
    }

    // Rotasi 90, 180, 270 derajat
    function rotate(canvasId, angle) {
      if (![90, 180, 270].includes(angle)) return;

      transformCanvas(canvasId, (width, height, srcData) => {
        const isSwap = angle === 90 || angle === 270;
        const newWidth = isSwap ? height : width;
        const newHeight = isSwap ? width : height;
        const result = new Uint8ClampedArray(newWidth * newHeight * 4);

        for (let y = 0; y < height; y++) {
          for (let x = 0; x < width; x++) {
            const srcIndex = (y * width + x) * 4;
            let dstX = x;
            let dstY = y;

            if (angle === 90) {
              dstX = height - 1 - y;
              dstY = x;
            } else if (angle === 180) {
              dstX = width - 1 - x;
              dstY = height - 1 - y;
            } else if (angle === 270) {
              dstX = y;
              dstY = width - 1 - x;
            }

            const dstIndex = (dstY * newWidth + dstX) * 4;
            result[dstIndex] = srcData[srcIndex];
            result[dstIndex + 1] = srcData[srcIndex + 1];
            result[dstIndex + 2] = srcData[srcIndex + 2];
            result[dstIndex + 3] = srcData[srcIndex + 3];
          }
        }

        return { width: newWidth, height: newHeight, data: result };
      });
    }

    // Flip horizontal
    function flipHorizontal(canvasId) {
      transformCanvas(canvasId, (width, height, srcData) => {
        const result = new Uint8ClampedArray(srcData.length);

        for (let y = 0; y < height; y++) {
          for (let x = 0; x < width; x++) {
            const srcIndex = (y * width + x) * 4;
            const dstX = width - 1 - x;
            const dstIndex = (y * width + dstX) * 4;
            result[dstIndex] = srcData[srcIndex];
            result[dstIndex + 1] = srcData[srcIndex + 1];
            result[dstIndex + 2] = srcData[srcIndex + 2];
            result[dstIndex + 3] = srcData[srcIndex + 3];
          }
        }

        return { width, height, data: result };
      });
    }

    // Flip vertical
    function flipVertical(canvasId) {
      transformCanvas(canvasId, (width, height, srcData) => {
        const result = new Uint8ClampedArray(srcData.length);

        for (let y = 0; y < height; y++) {
          for (let x = 0; x < width; x++) {
            const srcIndex = (y * width + x) * 4;
            const dstY = height - 1 - y;
            const dstIndex = (dstY * width + x) * 4;
            result[dstIndex] = srcData[srcIndex];
            result[dstIndex + 1] = srcData[srcIndex + 1];
            result[dstIndex + 2] = srcData[srcIndex + 2];
            result[dstIndex + 3] = srcData[srcIndex + 3];
          }
        }

        return { width, height, data: result };
      });
    }

    // Save canvas sebagai citra
    function saveImage(canvasId) {
      const canvas = document.getElementById(canvasId);
      const link = document.createElement("a");
      link.download = canvasId + ".png";
      link.href = canvas.toDataURL();
      link.click();
    }

    // Event listener input file
    document.getElementById("file1").addEventListener("change", function () {
      loadImage(this, "gambar");
    });
  </script>
</body>
</html>
